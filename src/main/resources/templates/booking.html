<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Car</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="navbar">
        <a class="brand" th:href="@{/}">Carista</a>
        <div class="nav-links">
            <a th:href="@{/cars}">Cars</a>
            <a th:href="@{/cars/{id}(id=${car.id})}">Car Details</a>
        </div>
    </div>

    <div class="container">
        <div class="card form-card">
            <h1 class="section-title">Book Car</h1>

            <p>
                You are booking:
                <strong th:text="${car.name}">Car name</strong>
                -
                <span th:text="${car.model}">Model</span>
            </p>

            <form th:action="@{/booking/save}" th:object="${booking}" method="post">
                <input type="hidden" name="carId" th:value="${car.id}">

                <div class="form-row">
                    <label>Start Date</label>
                    <input type="date" th:field="*{startDate}" required>
                    <span class="error" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></span>
                </div>

                <div class="form-row">
                    <label>End Date</label>
                    <input type="date" th:field="*{endDate}" required>
                    <span class="error" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></span>
                </div>

                <button class="button" type="submit">Submit Booking</button>
                <a class="button button-secondary" th:href="@{/cars/{id}(id=${car.id})}">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
